<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Free Ad | EXmobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-mobile-screen-button"></i> <span>EX</span>mobile
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html">Safety Checklist</a>
            <a href="index.html" class="btn-post"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </nav>
    </header>

    <!-- Post Ad Form Container -->
    <div class="form-container">
        <div class="form-header">
            <h2>Sell Your Phone on <span>EXmobile</span></h2>
            <p>Fill in the details below to upload your listing for free.</p>
        </div>

        <form id="adForm" class="post-ad-form" enctype="multipart/form-data">
            
            <!-- Section 1: Phone Details -->
            <div class="form-section">
                <h3><i class="fa-solid fa-mobile-button"></i> Phone Details</h3>
                
                <div class="form-group">
                    <label>Select Brand *</label>
                    <select id="brand" required>
                        <option value="">Choose Brand</option>
                        <option value="apple">Apple</option>
                        <option value="samsung">Samsung</option>
                        <option value="google">Google Pixel</option>
                        <option value="xiaomi">Xiaomi / Redmi</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Model Name *</label>
                    <input type="text" id="model" placeholder="e.g. Pixel 8 Pro, iPhone 14, Galaxy A15" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Storage *</label>
                        <select id="storage" required>
                            <option value="">Select Storage</option>
                            <option value="64GB">64 GB</option>
                            <option value="128GB">128 GB</option>
                            <option value="256GB">256 GB</option>
                            <option value="512GB">512 GB or above</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Battery Health (%)</label>
                        <input type="number" id="batteryHealth" min="50" max="100" placeholder="e.g. 88">
                    </div>
                </div>

                <div class="form-group">
                    <label>Condition & Accessories</label>
                    <input type="text" id="condition" placeholder="e.g. Mint Condition, Full Box with Original Cable">
                </div>

                <div class="form-group">
                    <label>Price (LKR) *</label>
                    <input type="number" id="price" placeholder="e.g. 125000" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="4" placeholder="Describe any scratches, warranty status, or reason for selling..."></textarea>
                </div>
            </div>

            <!-- Section 2: Photos Upload -->
            <div class="form-section">
                <h3><i class="fa-solid fa-camera"></i> Phone Photos</h3>
                <div class="form-group">
                    <label>Upload Clear Photos (Max 4 photos) *</label>
                    <div class="file-upload-box">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Click to browse or drag & drop phone photos</p>
                        <input type="file" id="photos" multiple accept="image/*" required>
                    </div>
                </div>
            </div>

            <!-- Section 3: Contact Details -->
            <div class="form-section">
                <h3><i class="fa-solid fa-user-check"></i> Seller Information</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Your Name *</label>
                        <input type="text" id="sellerName" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label>Location / City *</label>
                        <input type="text" id="location" placeholder="e.g. Colombo, Kandy, Gampaha" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>WhatsApp Number *</label>
                    <input type="tel" id="whatsapp" placeholder="e.g. 0771234567" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit-ad"><i class="fa-solid fa-paper-plane"></i> Publish My Ad</button>

        </form>
    </div>

    <script>
document.getElementById('adForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData();
    formData.append('brand', document.getElementById('brand').value);
    formData.append('model', document.getElementById('model').value);
    formData.append('storage', document.getElementById('storage').value);
    formData.append('batteryHealth', document.getElementById('batteryHealth').value);
    formData.append('condition', document.getElementById('condition').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('description', document.getElementById('description').value);
    formData.append('sellerName', document.getElementById('sellerName').value);
    formData.append('location', document.getElementById('location').value);
    formData.append('whatsapp', document.getElementById('whatsapp').value);

    // Image Input එකෙන් Files ලබා ගැනීම
    const fileInput = document.getElementById('photos');
    if (fileInput && fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('photos', fileInput.files[i]);
        }
    }

    try {
        // Vercel Live Backend URL එක මඟින් Update කරන ලදී
        const response = await fetch('https://exmobile-backend-api.vercel.app/api/ads', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        if (response.ok && result.success !== false) {
            alert('Ad Published Successfully!');
            window.location.href = 'index.html';
        } else {
            alert('Error: ' + (result.message || 'Failed to post ad'));
        }
    } catch (error) {
        console.error('Error submitting ad:', error);
        alert('Server connection failed!');
    }
});
</script>

</body>
</html>
